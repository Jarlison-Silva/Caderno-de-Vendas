<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caderno de Vendas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Caderno de Vendas</h1>

        <!-- FORMULÁRIO DE CADASTRO DE VENDA -->
        <form id="formVenda">
            <div class="campo">
                <label for="produto">Item / Produto:</label>
                <!-- pattern: não aceita nome só com espaços -->
                <input type="text" id="produto" placeholder="Ex: Brigadeiro"
                       pattern=".*\S.*" title="Digite o nome do item" required>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" value="1" min="1" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor unitário (R$):</label>
                    <input type="number" id="valor" step="0.01" min="0.01" placeholder="Ex: 3.50" required>
                </div>
            </div>

            <button type="submit">Registrar Venda</button>
        </form>

        <!-- TOTAL DO DIA -->
        <div class="total-box">
            <h2>Total do Dia: <span id="totalDia">R$ 0,00</span></h2>
        </div>

        <!-- VENDAS DE HOJE -->
        <h3>Vendas de Hoje</h3>
        <ul id="listaVendas"></ul>

        <!-- DIAS ANTERIORES (cada dia abre e mostra o que foi vendido) -->
        <details id="diasAnteriores" hidden>
            <summary>Dias anteriores</summary>
            <div id="listaDias"></div>
        </details>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
